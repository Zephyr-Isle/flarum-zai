zephyrisle-flarum-zai-bot:
  admin:
    settings:
      providers_label: 'Providers'
      providers_help: 'Configure one or more AI providers. They are tried in order; if one fails the next is used automatically. Multiple keys on the same provider also fail over and are used round-robin. LLM chat requests use this configuration; Embedding has its own independent settings below.'
      provider_name_placeholder: 'e.g. DeepSeek / OpenAI (optional)'
      provider_enabled_label: 'Enabled'
      provider_move_up: 'Move up'
      provider_move_down: 'Move down'
      provider_delete: 'Delete this provider'
      provider_add: 'Add provider'
      provider_empty: 'No providers configured yet. Click “Add provider” to get started.'
      provider_url_label: 'API URL'
      provider_url_placeholder: 'https://api.example.com/v1'
      provider_keys_label: 'API Keys (comma-separated, auto-failover)'
      provider_keys_placeholder: 'sk-xxx,sk-yyy'
      provider_model_label: 'Model'
      provider_model_placeholder: 'gpt-4o-mini'
      provider_url_required: 'API URL is required'
      provider_url_invalid: 'API URL must start with http:// or https://'
      provider_keys_required: 'Enter at least one API key'
      provider_model_required: 'Model is required'
      provider_vision_label: 'Model supports image recognition (vision input)'
      provider_vision_help: 'When enabled, images in user posts/messages are sent to this model as image content so it can see and understand them. Only enable for vision-capable models (e.g. gpt-4o, qwen-vl, glm-4v).'
      providers_migrated: 'Legacy settings detected and imported into the list above. Please review and save.'
      username_label: Bot Username
      random_reply_chance_label: 'Random Reply Chance (%)'
      reply_cooldown_label: 'Reply Decision Window (seconds)'
      reply_cooldown_help: When the bot has replied within this many seconds, the AI reviews the new context and decides on its own whether to reply again (it may stay silent). Set to 0 to always reply.
      system_prompt_label: System Prompt
      message_reply_enabled_label: 'Enable AI Replies in Messages (requires flarum/messages)'
      bot_display_name_label: Bot Display Name
      timezone_label: Timezone
      jina_optimization_mode_label: 'Jina Optimization Mode (enable web search via Jina AI)'
      jina_optimization_mode_help: Registers the web_search tool so the bot can search the web and read URLs.
      jina_proxy_url_label: 'Jina Proxy URL (custom proxy override)'
      jina_proxy_url_help: Leave empty to use the default s.jinaai.cn / r.jinaai.cn mirrors. Requires Jina Optimization Mode to be enabled.
      jina_use_builtin_proxy_label: 'Use server as built-in Jina proxy'
      jina_use_builtin_proxy_help: Requests go through this server (useful when the server cannot reach Jina directly). Requires Jina Optimization Mode to be enabled.
      openweather_key_label: OpenWeather API Key
      openweather_city_label: OpenWeather City
      embedding_api_url_label: 'Embedding API URL'
      embedding_api_url_help: 'Defaults to Jina AI (https://api.jina.ai/v1). Any OpenAI-compatible embeddings endpoint works.'
      embedding_api_key_label: 'Embedding API Key'
      embedding_api_key_help: 'Independent from the LLM provider keys above. Get a free key at jina.ai.'
      embedding_model_label: Embedding Model
      embedding_model_help: 'Embedding model for vector memory (pgvector). Defaults to Jina jina-embeddings-v3 (1024 dims, must match the pgvector column). Other Jina models may output different dimensions (e.g. v2 = 768) and would not fit the 1024-dim column.'
      wake_mention_rules_enabled_label: 'Mention wake rules'
      wake_mention_rules_enabled_help: 'Enable keyword/regex triggers: the bot replies when a rule matches, optionally scoped to discussions and users.'
      wake_mention_rules_label: 'Mention wake rules'
      wake_mention_rules_help: 'One rule per line; lines starting with # are comments. A bare keyword matches as substring; use re: for PCRE regex (case-insensitive). Scope: @g:discussionId1,id2 (whitelist), @g:!id (blacklist), @u:userId. Examples: 小米 / re:^(?=.*群主)(?=.*笨蛋).*$ / 关键字 @g:123 @u:10001 / 关键字 @g:!456'
      wake_relevance_enabled_label: 'Relevance wake'
      wake_relevance_enabled_help: 'Analyzes how related the new post is to the conversation and proactively follows up; denoises ultra-short messages and questions, and picks history length based on message length.'
      wake_expert_enabled_label: 'Expert Q&A'
      wake_expert_enabled_help: 'Detects professional questions / help requests (two-stage: question threshold + help keywords) and provides precise answers.'
      wake_boredom_enabled_label: 'Boredom wake'
      wake_boredom_enabled_help: 'Detects cold-scene / boredom / chat-seeking signals and wakes up; filters out long narratives to reduce false triggers.'
      wake_merge_seconds_label: 'Message merge window (seconds)'
      wake_merge_seconds_help: '>0 collects subsequent posts in the window before one unified request (hard-wait merge: saves tokens, slower replies); 0 disables. Also enables dynamic recompute: drops the current result when newer posts appear during processing.'
      wake_merge_max_label: 'Merge limit (messages)'
      wake_merge_max_help: 'Maximum messages merged into one request (1-20); collection stops once reached.'
      wake_merge_require_wake_label: 'Merged messages must also satisfy wake conditions'
      wake_merge_require_wake_help: 'When enabled, new messages inside the merge window are only included if they themselves trigger a wake condition.'
      media_link_parse_enabled_label: 'Link parsing'
      media_link_parse_enabled_help: 'Automatically fetches links in posts/messages, extracts the page title and summary, and injects them into context. Includes private-network blocking (SSRF protection), a domain blacklist, timeout/size limits and 24h caching.'
      media_link_blacklist_label: 'Link domain blacklist'
      media_link_blacklist_help: 'One domain per line (# starts a comment); exact or subdomain match. Blacklisted links are not fetched.'
      media_link_timeout_label: 'Link fetch timeout (seconds)'
      media_link_timeout_help: 'Request timeout for a single link.'
      media_link_max_bytes_label: 'Link download limit (bytes)'
      media_link_max_bytes_help: 'Maximum page bytes read per link; larger pages keep only the beginning.'
      media_link_max_links_label: 'Max links parsed per message'
      media_link_max_links_help: 'Maximum number of links parsed per message (1-5).'
      media_file_parse_enabled_label: 'File parsing'
      media_file_parse_enabled_help: 'Injects filename and size for fof/upload files in posts/messages; reads the beginning of text files and best-effort text from PDFs. Results cached for 30 days.'
      media_image_classify_enabled_label: 'Image type labeling'
      media_image_classify_enabled_help: 'Labels emoji/GIF/sticker images when sending them to the vision model, helping it distinguish content types.'
      ctx_inject_timing_label: 'Context injection timing'
      ctx_inject_timing_help: 'When to inject scenario/identity fields and recent discussion events into the model: before proactive wake (probability/relevance/expert/boredom, not explicit mentions or rules), before all wakes, or off.'
      ctx_timing_proactive: 'Before proactive wake'
      ctx_timing_all: 'Before all wakes'
      ctx_timing_off: 'Off'
      ctx_event_record_enabled_label: 'Event recording'
      ctx_event_record_enabled_help: 'Record forum events (post hidden/restored/deleted/revised, discussion started/renamed/hidden/restored/deleted) into the context log for injection.'
      ctx_format_label: 'Injection format'
      ctx_format_help: 'Concise: one line per entry; detailed: also carries msg_id, actor, event type and other structural info.'
      ctx_format_concise: 'Concise'
      ctx_format_detailed: 'Detailed'
      ctx_entry_max_chars_label: 'Max chars per entry'
      ctx_entry_max_chars_help: 'Maximum characters per context entry; longer entries are truncated.'
      ctx_max_events_label: 'Max events'
      ctx_max_events_help: 'Maximum number of recent events injected per reply (1-50).'
      memory_hybrid_vector_weight_label: 'Hybrid retrieval vector weight (%)'
      memory_hybrid_vector_weight_help: 'Fusion weight for the two retrieval paths (BM25 keyword + vector semantics): the vector share (0-100), keyword is the rest. Default 60 (60% vector / 40% keyword).'
      memory_decay_days_label: 'Memory decay period (days)'
      memory_decay_days_help: 'The longer since a memory was last recalled, the lower its recall rank. Decays one step per this many days (default 30).'
      pgvector_host_label: 'PostgreSQL Host (for pgvector memory, leave empty to disable)'
      pgvector_host_help: 'Requires the pgvector extension. Embedding dimension must match the model (jina-embeddings-v3 = 1024).'
      pgvector_port_label: PostgreSQL Port
      pgvector_db_label: PostgreSQL Database
      pgvector_user_label: PostgreSQL User
      pgvector_password_label: PostgreSQL Password

    api_test:
      title: API Test
      description: Test LLM and Embedding API connectivity and configuration.
      test_all: Test All
      test_llm: Test LLM
      test_embedding: Test Embedding
      testing: Testing...
      success_llm_provider: 'OK - {name} ({model}): {reply}'
      success_embedding_provider: 'OK - {name} ({model}): {dimensions} dims'
      failed_provider: '{name} failed: {error}'
      failed: 'Failed: {error}'

    affinities:
      title: Bot Affinities
      description: User affinity scores for the AI bot. Scores increase with each interaction.
      loading: Loading...
      refresh: Refresh
      no_affinities: No affinities recorded yet.
      total_records: '{total} records'
      page_prev: Previous page
      page_next: Next page
      error: 'Failed to load affinities: {error}'
      table:
        user: User
        total_score: Score
        interactions: Interactions
        last_interaction: Last Interaction
