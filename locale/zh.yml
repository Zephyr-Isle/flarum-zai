    settings:
      providers_label: '供应商配置'
      providers_help: '配置一个或多个 AI 供应商，按顺序尝试，失败自动回退到下一个；同一供应商的多个密钥也会自动故障转移与轮询。仅 LLM 对话请求使用此配置；Embedding 使用下方独立的设置。'
      provider_name_placeholder: '例如 DeepSeek / OpenAI（可选）'
      provider_enabled_label: '启用'
      provider_move_up: '上移'
      provider_move_down: '下移'
      provider_delete: '删除该供应商'
      provider_add: '添加供应商'
      providers_empty: '尚未配置任何供应商，点击“添加供应商”开始配置。'
      provider_url_label: 'API 地址'
      provider_url_placeholder: 'https://api.example.com/v1'
      provider_keys_label: 'API 密钥（多个用英文逗号分隔，自动故障转移）'
      provider_keys_placeholder: 'sk-xxx,sk-yyy'
      provider_model_label: '模型'
      provider_model_placeholder: 'gpt-4o-mini'
      provider_url_required: 'API 地址不能为空'
      provider_url_invalid: 'API 地址需以 http:// 或 https:// 开头'
      provider_keys_required: '请至少输入一个 API 密钥'
      provider_model_required: '模型不能为空'
      provider_vision_label: '模型支持识图（视觉输入）'
      provider_vision_help: '启用后，用户帖子/私信中的图片会以图片形式发送给该模型，供其识别理解（模型将知道图片的存在并可查看内容）。仅支持视觉输入的模型可启用，如 gpt-4o、qwen-vl、glm-4v 等。'
      provider_capabilities_label: '多模态能力'
      provider_capabilities_help: '启用对应的多模态能力后，帖子/私信中的媒体会以对应格式发送给模型。不支持的类型会降级为文本描述。'
      provider_capability_image: '图片'
      provider_capability_video: '视频'
      provider_capability_audio: '音频'
      providers_migrated: '检测到旧版设置，已自动导入到上方列表，请核对后保存。'
      username_label: 机器人用户名
      random_reply_chance_label: '随机回复概率（%）'
      reply_cooldown_label: '回复决策窗口（秒）'
      reply_cooldown_help: 距上次回复不超过该秒数时，AI 会结合上下文自主决定是否再次回复（必要时可保持沉默）。设为 0 表示总是回复。
      system_prompt_label: 系统提示词
      message_reply_enabled_label: '启用私信 AI 回复（需要 flarum/messages）'
      chat_reply_enabled_label: '启用聊天频道 AI 回复（需要 ramon/chat）'
      bot_display_name_label: 机器人显示名称
      timezone_label: 时区
      jina_optimization_mode_label: 'Jina 优化模式（启用 Jina AI 网页搜索）'
      jina_optimization_mode_help: 启用后将为机器人注册 web_search 工具，可搜索互联网或读取指定 URL。
      jina_proxy_url_label: 'Jina 代理地址（自定义代理覆盖）'
      jina_proxy_url_help: 留空使用默认的 s.jinaai.cn / r.jinaai.cn 国内镜像。需先启用 Jina 优化模式。
      jina_use_builtin_proxy_label: '使用本服务器作为内建 Jina 代理'
      jina_use_builtin_proxy_help: 请求经由本服务器转发（服务器无法直连 Jina 时使用）。需先启用 Jina 优化模式。
      openweather_key_label: OpenWeather API 密钥
      openweather_city_label: OpenWeather 城市
      embedding_api_url_label: 'Embedding API 地址'
      embedding_api_url_help: '默认使用 Jina AI（https://api.jina.ai/v1），也可填写任意 OpenAI 兼容的 Embedding 端点。'
      embedding_api_key_label: 'Embedding API 密钥'
      embedding_api_key_help: '与上方 LLM 供应商密钥相互独立，可在 jina.ai 免费申请。支持多个密钥（逗号分隔），系统会自动轮询。'
      embedding_model_label: Embedding 模型
      embedding_model_help: '用于向量记忆（pgvector）的 Embedding 模型。默认 jina-embeddings-v3（1024 维，须与 pgvector 列维度一致）。其他 Jina 模型维度可能不同（如 v2 为 768），将无法写入 1024 维的列。'
      wake_mention_rules_enabled_label: '提及唤醒规则'
      wake_mention_rules_enabled_help: '启用关键词/正则触发：内容命中规则即回复，可限定讨论帖与用户作用域。'
      wake_mention_rules_label: '提及唤醒规则内容'
      wake_mention_rules_help: '每行一条规则：# 开头为注释。关键词直接写，正则用 re: 前缀（PCRE，自动忽略大小写）。作用域：@g:讨论帖ID1,ID2（白名单）、@g:!ID（黑名单）、@u:用户ID。示例：小米 / re:^(?=.*群主)(?=.*笨蛋).*$ / 关键字 @g:123 @u:10001 / 关键字 @g:!456'
      wake_relevance_enabled_label: '相关性唤醒'
      wake_relevance_enabled_help: '自动分析当前消息与上文的关联度，聊到相关话题时主动跟进；对超短消息与问句降噪，并按消息长度动态选择历史条数。'
      wake_expert_enabled_label: '专业答疑'
      wake_expert_enabled_help: '识别群内专业提问/求助信号（提问门槛 + 求助关键词两段式判定），精准提供帮助。'
      wake_boredom_enabled_label: '无聊唤醒'
      wake_boredom_enabled_help: '识别冷场/无聊/求聊天语境并触发唤醒；自动过滤长叙述，降低误触发。'
      wake_merge_seconds_label: '消息合并窗口（秒）'
      wake_merge_seconds_help: '>0 时先收集窗口内的后续帖子再统一发起请求（硬等待合并，节省 token 但回复更慢）；0 关闭。同时启用动态软重算：处理期间出现新帖子时放弃本轮结果。'
      wake_merge_max_label: '合并数量上限（条）'
      wake_merge_max_help: '单次最多合并的消息条数（1-20），超限后停止收集。'
      wake_merge_require_wake_label: '合并消息也需满足唤醒条件'
      wake_merge_require_wake_help: '开启后，合并窗口内的新消息也需命中唤醒条件才会被并入本次回复。'
      media_link_parse_enabled_label: '链接解析'
      media_link_parse_enabled_help: '自动抓取帖子/私信中的链接，提取网页标题与正文摘要注入上下文。含内网拦截（SSRF 防护）、域名黑名单、超时/大小上限与 24 小时缓存。'
      media_link_blacklist_label: '链接域名黑名单'
      media_link_blacklist_help: '每行一个域名（# 开头为注释），精确或子域匹配；命中的链接不抓取。'
      media_link_timeout_label: '链接抓取超时（秒）'
      media_link_timeout_help: '单个链接的请求超时时间。'
      media_link_max_bytes_label: '链接下载上限（字节）'
      media_link_max_bytes_help: '单次最多读取的网页体积，超过则只保留开头部分。'
      media_link_max_links_label: '每帖解析链接数上限'
      media_link_max_links_help: '单条消息最多解析的链接数量（1-5）。'
      media_file_parse_enabled_label: '文件解析'
      media_file_parse_enabled_help: '帖子/私信中的 fof/upload 文件自动注入文件名与大小；文本文件读取开头片段，PDF 尽力提取开头文本。结果缓存 30 天。'
      media_image_classify_enabled_label: '图片类型标注'
      media_image_classify_enabled_help: '发送图片给识图模型时标注表情包/GIF/贴纸，帮助模型区分内容类型。'
      ctx_inject_timing_label: '上下文注入时机'
      ctx_inject_timing_help: '何时把场景/身份环境字段与讨论近期事件注入给模型：主动唤醒前（概率/相关性/答疑/无聊唤醒时注入，显式 @ 与规则不注入）、全唤醒前（每次回复都注入）或关闭。'
      ctx_timing_proactive: '主动唤醒前'
      ctx_timing_all: '全唤醒前'
      ctx_timing_off: '关闭'
      ctx_event_record_enabled_label: '事件记录'
      ctx_event_record_enabled_help: '把论坛事件（帖子撤回/恢复/删除/编辑，讨论创建/改名/隐藏/恢复/删除）写入上下文记录表，供注入使用。'
      ctx_format_label: '注入格式'
      ctx_format_help: '精简：一行一条；详细：额外携带 msg_id、操作者、事件类型等结构信息。'
      ctx_format_concise: '精简'
      ctx_format_detailed: '详细'
      ctx_entry_max_chars_label: '条目最大字符数'
      ctx_entry_max_chars_help: '每条上下文文本的最大字符数，超出部分自动截断。'
      ctx_max_events_label: '事件条数上限'
      ctx_max_events_help: '每次注入最多携带的近期事件条数（1-50）。'
      memory_hybrid_vector_weight_label: '混合检索向量权重（%）'
      memory_hybrid_vector_weight_help: 'BM25 关键词与向量语义双路召回的融合权重：向量路占比（0-100），关键词路为剩余部分。默认 60（向量 60% / 关键词 40%）。'
      memory_decay_days_label: '记忆时间衰减周期（天）'
      memory_decay_days_help: '距上次召回越久，记忆在召回排序中的分数越低。每经过该天数衰减一档（默认 30 天）。'
      affinity_blacklist_threshold_label: '黑名单熔断阈值（好感度）'
      affinity_blacklist_threshold_help: '好感度 ≤ 该值时自动将用户加入黑名单，黑名单用户不再触发任何 AI 回复（熔断保护）。设为 0 表示禁用自动熔断；管理员可在好感度管理页手动拉黑/恢复或一键重置。'
      relation_network_enabled_label: '启用关系网（身份/别名/边界/待确认观察）'
      relation_network_enabled_help: 'AI 可通过 update_relation_network 工具维护与用户的长期稳定关系信息，并在每次回复时注入关系网摘要。关闭后不注入也不提供工具。'
      expression_learning_enabled_label: '启用表达学习（待审核/已启用/已禁用）'
      expression_learning_enabled_help: 'AI 可通过 learn_expression 工具从对话中归纳"怎么说"（短表达/句法/情境风格），新规则一律进入待审核，管理员通过后才进入回复。关闭后不注入也不提供工具。'
      agnes_api_key_label: 'Agnes AI API 密钥'
      agnes_api_key_help: '用于图片/视频生成。AI 调用 generate_image / generate_video 工具时使用此密钥。留空则禁用生成功能。'
      pgvector_host_label: 'PostgreSQL 主机（用于 pgvector 记忆，留空禁用）'
      pgvector_host_help: '需要 pgvector 扩展。向量维度须与模型一致（jina-embeddings-v3 为 1024）。'
      pgvector_port_label: PostgreSQL 端口
      pgvector_db_label: PostgreSQL 数据库名
      pgvector_user_label: PostgreSQL 用户名
      pgvector_password_label: PostgreSQL 密码

