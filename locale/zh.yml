zephyrisle-flarum-zai-bot:
  admin:
    settings:
      providers_label: '供应商配置'
      providers_help: '配置一个或多个 AI 供应商，按顺序尝试，失败自动回退到下一个；同一供应商的多个密钥也会自动故障转移与轮询。仅 LLM 对话请求使用此配置；Embedding 使用下方独立的设置。'
      provider_name_placeholder: '例如 DeepSeek / OpenAI（可选）'
      provider_enabled_label: '启用'
      provider_move_up: '上移'
      provider_move_down: '下移'
      provider_delete: '删除该供应商'
      provider_add: '添加供应商'
      provider_empty: '尚未配置任何供应商，点击“添加供应商”开始配置。'
      provider_url_label: 'API 地址'
      provider_url_placeholder: 'https://api.example.com/v1'
      provider_keys_label: 'API 密钥（多个用英文逗号分隔，自动故障转移）'
      provider_keys_placeholder: 'sk-xxx,sk-yyy'
      provider_model_label: '模型'
      provider_model_placeholder: 'gpt-4o-mini'
      provider_url_required: 'API 地址不能为空'
      provider_url_invalid: 'API 地址需以 http:// 或 https:// 开头'
      provider_keys_required: '请至少输入一个 API 密钥'
      provider_model_required: '模型不能为空'
      providers_migrated: '检测到旧版设置，已自动导入到上方列表，请核对后保存。'
      username_label: 机器人用户名
      random_reply_chance_label: '随机回复概率（%）'
      reply_cooldown_label: '回复决策窗口（秒）'
      reply_cooldown_help: 距上次回复不超过该秒数时，AI 会结合上下文自主决定是否再次回复（必要时可保持沉默）。设为 0 表示总是回复。
      system_prompt_label: 系统提示词
      message_reply_enabled_label: '启用私信 AI 回复（需要 flarum/messages）'
      bot_display_name_label: 机器人显示名称
      timezone_label: 时区
      jina_optimization_mode_label: 'Jina 优化模式（启用 Jina AI 网页搜索）'
      jina_optimization_mode_help: 启用后将为机器人注册 web_search 工具，可搜索互联网或读取指定 URL。
      jina_proxy_url_label: 'Jina 代理地址（自定义代理覆盖）'
      jina_proxy_url_help: 留空使用默认的 s.jinaai.cn / r.jinaai.cn 国内镜像。需先启用 Jina 优化模式。
      jina_use_builtin_proxy_label: '使用本服务器作为内建 Jina 代理'
      jina_use_builtin_proxy_help: 请求经由本服务器转发（服务器无法直连 Jina 时使用）。需先启用 Jina 优化模式。
      openweather_key_label: OpenWeather API 密钥
      openweather_city_label: OpenWeather 城市
      embedding_api_url_label: 'Embedding API 地址'
      embedding_api_url_help: '默认使用 Jina AI（https://api.jina.ai/v1），也可填写任意 OpenAI 兼容的 Embedding 端点。'
      embedding_api_key_label: 'Embedding API 密钥'
      embedding_api_key_help: '与上方 LLM 供应商密钥相互独立，可在 jina.ai 免费申请。'
      embedding_model_label: Embedding 模型
      embedding_model_help: '用于向量记忆（pgvector）的 Embedding 模型。默认 jina-embeddings-v3（1024 维，须与 pgvector 列维度一致）。其他 Jina 模型维度可能不同（如 v2 为 768），将无法写入 1024 维的列。'
      pgvector_host_label: 'PostgreSQL 主机（用于 pgvector 记忆，留空禁用）'
      pgvector_host_help: '需要 pgvector 扩展。向量维度须与模型一致（jina-embeddings-v3 为 1024）。'
      pgvector_port_label: PostgreSQL 端口
      pgvector_db_label: PostgreSQL 数据库名
      pgvector_user_label: PostgreSQL 用户名
      pgvector_password_label: PostgreSQL 密码

    api_test:
      title: API 测试
      description: 测试 LLM 与 Embedding API 的连通性和配置是否正确。
      test_all: 全部测试
      test_llm: 测试 LLM
      test_embedding: 测试 Embedding
      testing: 测试中...
