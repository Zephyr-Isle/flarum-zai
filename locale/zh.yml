      total_records: '共 {total} 条记录'
      page_prev: 上一页
      page_next: 下一页
      error: '加载好感度失败：{error}'
      table:
        user: 用户
        total_score: 好感度
        interactions: 互动次数
        last_interaction: 最后互动
